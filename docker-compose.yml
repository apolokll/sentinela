networks:
  sentinela-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  alvo-web:
    image: nginx:alpine
    container_name: alvo-web
    networks:
      sentinela-net:
        ipv4_address: 172.20.0.10

  sentinela:
    build: .
    container_name: sentinela
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      sentinela-net:
        ipv4_address: 172.20.0.20
    depends_on:
      - alvo-web