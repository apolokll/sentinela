  version: '3.8'

  services:
    alvo-web:
      image: nginx:alpine
      container_name: alvo-web
      networks:
        sentinela-net:
          ipv4_address: 172.20.0.10

    sentinela:
      build: .
      container_name: sentinela
      cap_add: [NET_ADMIN, NET_RAW]
      networks:
        sentinela-net:
          ipv4_address: 172.20.0.20
      depends_on:
        - alvo-web
        - zabbix-server

    zabbix-db:
      image: postgres:15-alpine
      container_name: zabbix-db
      environment:
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix_password
        POSTGRES_DB: zabbix
      networks:
        - sentinela-net

    zabbix-server:
      image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
      container_name: zabbix-server
      environment:
        DB_SERVER_HOST: zabbix-db
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix_password
        POSTGRES_DB: zabbix
      ports:
        - "10051:10051"
      networks:
        sentinela-net:
          ipv4_address: 172.20.0.30
      depends_on:
        - zabbix-db

    zabbix-web:
      image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
      container_name: zabbix-web
      environment:
        ZBX_SERVER_HOST: zabbix-server
        DB_SERVER_HOST: zabbix-db
        POSTGRES_USER: zabbix
        POSTGRES_PASSWORD: zabbix_password
        POSTGRES_DB: zabbix
      ports:
        - "8080:8080"
      networks:
        - sentinela-net
      depends_on:
        - zabbix-server

  networks:
    sentinela-net:
      driver: bridge
      ipam:
        config:
          - subnet: 172.20.0.0/24